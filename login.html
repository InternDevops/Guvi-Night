<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Night</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="page-wrapper">
    <div class="auth-card">

      <!-- Brand -->
      <div class="brand-mark">
        <div class="brand-icon">⬡</div>
        <span class="brand-name">Night</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to continue to your workspace.</p>

      <!-- Alert Area -->
      <div id="alertArea"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate autocomplete="off">

        <!-- Email / Username -->
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Username</label>
          <div class="input-wrap">
            <input type="text" class="form-control" id="identifier" name="identifier"
                   placeholder="jane@example.com" required />
            <i class="bi bi-person input-icon"></i>
          </div>
          <div class="invalid-feedback">This field is required.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Your password" required />
            <i class="bi bi-lock input-icon"></i>
            <button type="button" class="toggle-password" aria-label="Toggle password">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <!-- Remember -->
        <div class="form-check mb-3" style="margin-top:0.2rem;">
          <input class="form-check-input" type="checkbox" id="rememberMe"
                 style="background-color:var(--input-bg);border-color:var(--input-border);" />
          <label class="form-check-label" for="rememberMe"
                 style="font-size:0.85rem;color:var(--text-secondary);">Remember me</label>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary-custom" id="submitBtn">
          Sign in
        </button>

      </form>

      <div class="divider">or</div>
      <p class="auth-link-text">Don't have an account? <a href="register.html">Sign up</a></p>

    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Login Logic -->
  <script src="js/login.js"></script>
</body>
</html>
